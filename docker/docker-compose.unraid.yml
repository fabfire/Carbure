# Fork deployment on Unraid, as a Portainer stack built from this Git repository
# (Stacks > Add stack > Repository, compose path: docker/docker-compose.unraid.yml).
# The image is built on the server from the branch chosen in Portainer. The data is the
# one of the previous stack: /mnt/user/appdata/carbure and the existing database volume,
# whose exact name (Portainer > Volumes) is given by DB_VOLUME.
# Environment variables of the stack: DB_PASSWORD (the one of the previous stack) and
# DB_VOLUME.
# Internal URL: https://money.tomatosoft.org through Traefik, on its external network
# "frontend". The name is a DNS-only CNAME (grey cloud, never proxied) at Cloudflare to
# traefik.unraid.tomatosoft.org, a private address: it resolves everywhere but is only
# reachable from the local network. The certificate comes from the "lets-encrypt"
# resolver of Traefik (DNS-01 through the Cloudflare API, the only challenge that works
# for a private address).
services:
  carbure:
    image: carbure-fork:local
    # Never pulled (the image is on no registry) and built again at each deployment:
    # "Pull and redeploy" of Portainer then takes the new code
    pull_policy: build
    build:
      # The build context is the root of the project
      context: ..
      dockerfile: docker/Dockerfile
    # No published port: the container is only reachable through Traefik. Uncomment for
    # a direct access (http://<unraid>:8080/), CARBURE_PORT when 8080 is taken.
    # ports:
    #   - "${CARBURE_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: carbure
      DB_USER: carbure
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      LANGUAGE: fr
      CARBURE_PORT: ${CARBURE_PORT:-8080}
      # Daily bank synchronization (seconds); remove to disable
      SYNC_INTERVAL: 86400
    volumes:
      - /mnt/user/appdata/carbure:/data
    networks:
      # default: the database; frontend: Traefik
      - default
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.carbure.rule=Host(`money.tomatosoft.org`)"
      - "traefik.http.routers.carbure.entrypoints=websecure"
      - "traefik.http.routers.carbure.tls=true"
      - "traefik.http.routers.carbure.tls.certresolver=lets-encrypt"
      - "traefik.http.services.carbure.loadbalancer.server.port=80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:13
    environment:
      MARIADB_DATABASE: carbure
      MARIADB_USER: carbure
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - carbure-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  # The existing volume: the stack fails to start when it is not found, instead of
  # creating an empty database
  carbure-db:
    external: true
    name: ${DB_VOLUME:-carbure_carbure-db}

networks:
  frontend:
    external: true
